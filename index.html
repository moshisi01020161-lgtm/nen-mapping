<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundBoard – ワンクリック音声プレイヤー</title>
  <meta name="description" content="音声ファイルのURLと題名を登録して、ワンクリックで再生できるサウンドボード。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f17;
      --surface: #161926;
      --card: #1e2235;
      --border: #2a2f4a;
      --accent1: #7c6af7;
      --accent2: #5eb8ff;
      --accent3: #ff6b9d;
      --text: #e8ecff;
      --muted: #7880a0;
      --success: #34d399;
      --danger: #f87171;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, .45);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── ANIMATED BACKGROUND ─────────────────────────────── */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124, 106, 247, .18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 80%, rgba(94, 184, 255, .13) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 60% 30%, rgba(255, 107, 157, .10) 0%, transparent 70%);
      animation: bgPulse 10s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% {
        opacity: .7;
      }

      100% {
        opacity: 1;
      }
    }

    /* ── LAYOUT ──────────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      width: 95%;
      margin: 0 auto;
      padding: 0 10px 80px;
    }

    /* ── HEADER ──────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 60px 0 44px;
    }

    header .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 40px rgba(124, 106, 247, .45);
      margin-bottom: 20px;
      animation: iconFloat 4s ease-in-out infinite;
    }

    @keyframes iconFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: .95rem;
    }

    /* ── ADD FORM ────────────────────────────────────────── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 36px;
      transition: border-color .3s;
    }

    .form-card:focus-within {
      border-color: var(--accent1);
    }

    .form-card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media(max-width:560px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-size: .78rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-size: .93rem;
      font-family: inherit;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }

    input:focus {
      border-color: var(--accent1);
      box-shadow: 0 0 0 3px rgba(124, 106, 247, .18);
    }

    input::placeholder {
      color: var(--muted);
      opacity: .55;
    }

    .btn-add {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(124, 106, 247, .35);
    }

    .btn-add:hover {
      opacity: .92;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(124, 106, 247, .5);
    }

    .btn-add:active {
      transform: translateY(0);
    }

    /* ── STATS BAR ───────────────────────────────────────── */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .stats-bar .count {
      font-size: .85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .stats-bar .count span {
      color: var(--accent2);
      font-weight: 600;
    }

    .search-wrap {
      flex: 1;
      margin: 0 20px;
      max-width: 400px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      color: var(--text);
      font-size: .85rem;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }

    .search-wrap input:focus {
      border-color: var(--accent1);
      box-shadow: 0 0 0 2px rgba(124, 106, 247, .18);
    }
    
    .search-wrap input::placeholder {
      color: var(--muted);
      opacity: .55;
    }

    .btn-clear-all {
      font-size: .78rem;
      color: var(--danger);
      background: none;
      border: none;
      cursor: pointer;
      opacity: .7;
      transition: opacity .2s;
    }

    .btn-clear-all:hover {
      opacity: 1;
    }

    /* ── BOARD GRID ──────────────────────────────────────── */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    /* ── SOUND CARD ──────────────────────────────────────── */
    .sound-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
      cursor: grab;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      animation: cardIn .35s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    .sound-card:active {
      cursor: grabbing;
    }

    .sortable-ghost {
      opacity: 0.4;
      background: var(--surface);
      border: 1px dashed var(--accent1);
      box-shadow: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(.88) translateY(12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .sound-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
      border-color: var(--accent1);
    }

    .sound-card.playing {
      border-color: var(--success);
      box-shadow: 0 0 0 2px rgba(52, 211, 153, .2), 0 12px 40px rgba(0, 0, 0, .4);
    }

    /* accent stripe */
    .sound-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      opacity: 0;
      transition: opacity .3s;
    }

    .sound-card:hover::before,
    .sound-card.playing::before {
      opacity: 1;
    }

    .sound-card.playing::before {
      background: linear-gradient(90deg, var(--success), var(--accent2));
    }

    .card-title {
      font-size: .88rem;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
      padding-right: 24px;
    }

    .btn-fav {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s, transform .2s, filter .2s;
    }

    .btn-fav:hover {
      transform: scale(1.15);
      color: var(--text);
    }

    .sound-card.favorite .btn-fav {
      color: #fbbf24;
      filter: drop-shadow(0 0 6px rgba(251, 191, 36, .4));
    }

    /* waveform bars */
    .waveform {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 20px;
      opacity: 0;
      transition: opacity .3s;
    }

    .sound-card.playing .waveform {
      opacity: 1;
    }

    .waveform span {
      flex: 1;
      background: var(--success);
      border-radius: 2px;
      animation: wave 1s ease-in-out infinite;
    }

    .waveform span:nth-child(1) {
      animation-delay: 0s;
      height: 40%;
    }

    .waveform span:nth-child(2) {
      animation-delay: .12s;
      height: 80%;
    }

    .waveform span:nth-child(3) {
      animation-delay: .24s;
      height: 55%;
    }

    .waveform span:nth-child(4) {
      animation-delay: .36s;
      height: 100%;
    }

    .waveform span:nth-child(5) {
      animation-delay: .48s;
      height: 65%;
    }

    .waveform span:nth-child(6) {
      animation-delay: .60s;
      height: 45%;
    }

    .waveform span:nth-child(7) {
      animation-delay: .72s;
      height: 85%;
    }

    .waveform span:nth-child(8) {
      animation-delay: .84s;
      height: 30%;
    }

    @keyframes wave {

      0%,
      100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(.3);
      }
    }

    /* progress bar */
    .progress-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      transition: opacity .3s;
    }

    .sound-card.playing .progress-wrap {
      opacity: 1;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent1), var(--success));
      border-radius: 2px;
      transition: width .5s linear;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-play {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      font-family: inherit;
      background: rgba(124, 106, 247, .15);
      color: var(--accent1);
      border: 1px solid rgba(124, 106, 247, .25);
      transition: background .2s, transform .15s, color .2s, border-color .2s;
    }

    .btn-play:hover {
      background: rgba(124, 106, 247, .28);
      border-color: var(--accent1);
      transform: scale(1.03);
    }

    .sound-card.playing .btn-play {
      background: rgba(52, 211, 153, .15);
      color: var(--success);
      border-color: var(--success);
    }

    .btn-delete {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: none;
      cursor: pointer;
      color: var(--muted);
      font-size: .95rem;
      transition: background .2s, color .2s, border-color .2s, transform .15s;
    }

    .btn-delete:hover {
      background: rgba(248, 113, 113, .12);
      color: var(--danger);
      border-color: var(--danger);
      transform: scale(1.08);
    }

    /* ── EMPTY STATE ─────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      animation: fadeIn .5s;
    }

    .empty svg {
      opacity: .3;
      margin-bottom: 16px;
    }

    .empty p {
      font-size: .95rem;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* ── TOAST ───────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 40px;
      font-size: .88rem;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 999;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── SCROLLBAR ───────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div class="bg-glow"></div>

  <div class="container">
    <!-- HEADER -->
    <header>
      <div class="logo-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect x="4" y="14" width="4" height="14" rx="2" fill="white" opacity=".9" />
          <rect x="11" y="8" width="4" height="20" rx="2" fill="white" />
          <rect x="18" y="4" width="4" height="28" rx="2" fill="white" />
          <rect x="25" y="10" width="4" height="18" rx="2" fill="white" opacity=".85" />
          <rect x="32" y="16" width="4" height="10" rx="2" fill="white" opacity=".6" />
        </svg>
      </div>
      <h1>SoundBoard</h1>
      <p>URLと題名を登録するだけ。ワンクリックで音声を再生。</p>
    </header>

    <!-- ADD FORM -->
    <div class="form-card" role="region" aria-label="音声を追加">
      <h2>🎵 音声を追加</h2>
      <div class="form-row">
        <div>
          <label for="input-title">題名</label>
          <input type="text" id="input-title" placeholder="例：BGM – 勝利のファンファーレ" autocomplete="off" />
        </div>
        <div>
          <label for="input-url">音声ファイル URL</label>
          <input type="url" id="input-url" placeholder="https://example.com/sound.mp3" autocomplete="off" />
        </div>
      </div>
      <button class="btn-add" id="btn-add" aria-label="サウンドボードに追加">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        追加する
      </button>
    </div>

    <!-- STATS -->
    <div class="stats-bar" id="stats-bar" style="display:none;">
      <p class="count">登録済み：<span id="count-num">0</span> 件</p>
      <div class="search-wrap">
        <input type="text" id="input-search" placeholder="音声を検索..." autocomplete="off" />
      </div>
      <button class="btn-clear-all" id="btn-clear-all">すべて削除</button>
    </div>

    <!-- BOARD -->
    <div class="board" id="board" role="list" aria-label="サウンドボード"></div>

    <!-- EMPTY STATE -->
    <div class="empty" id="empty-state">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
        <circle cx="36" cy="36" r="32" stroke="#7880a0" stroke-width="2" stroke-dasharray="6 4" />
        <path d="M28 24l20 12-20 12V24z" fill="#7880a0" />
      </svg>
      <p>まだ音声が登録されていません。<br />上のフォームからURLと題名を入力して追加してください。</p>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // ─── STATE ───────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'soundboard_v1';
    let sounds = [];          // [{ id, title, url, favorite }]
    let currentAudio = null;  // HTMLAudioElement
    let currentId = null;  // playing card id
    let searchQuery = '';

    // ─── INIT ─────────────────────────────────────────────────────────────────
    function load() {
      try { sounds = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { sounds = []; }
      render();
    }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(sounds)); }

    // ─── RENDER ───────────────────────────────────────────────────────────────
    function render() {
      const board = document.getElementById('board');
      const empty = document.getElementById('empty-state');
      const stats = document.getElementById('stats-bar');
      const countEl = document.getElementById('count-num');

      board.innerHTML = '';

      if (sounds.length === 0) {
        empty.style.display = 'block';
        stats.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      stats.style.display = 'flex';
      countEl.textContent = sounds.length;

      let filtered = sounds.filter(s => s.title.toLowerCase().includes(searchQuery.toLowerCase()));
      filtered.sort((a, b) => (b.favorite === true) - (a.favorite === true));

      if (filtered.length === 0 && sounds.length > 0) {
        board.innerHTML = '<div class="empty" style="grid-column: 1 / -1;"><p>検索結果がありません。</p></div>';
      }

      filtered.forEach(s => {
        const card = buildCard(s);
        board.appendChild(card);
      });

      if (window.Sortable) {
        Sortable.create(board, {
          animation: 150,
          disabled: searchQuery !== '',
          ghostClass: 'sortable-ghost',
          onEnd: function () {
            const newOrderIds = Array.from(board.children).map(c => c.dataset.id);
            const orderMap = new Map(newOrderIds.map((id, index) => [id, index]));
            
            sounds.sort((a, b) => {
              const aIndex = orderMap.has(a.id) ? orderMap.get(a.id) : Infinity;
              const bIndex = orderMap.has(b.id) ? orderMap.get(b.id) : Infinity;
              return aIndex - bIndex;
            });
            
            save();
            render();
          }
        });
      }
    }

    function buildCard({ id, title, url, favorite }) {
      const card = document.createElement('div');
      card.className = `sound-card ${favorite ? 'favorite' : ''}`;
      card.setAttribute('role', 'listitem');
      card.dataset.id = id;

      card.innerHTML = `
        <button class="btn-fav" data-id="${id}" aria-label="お気に入り" title="お気に入り">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="${favorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </button>
        <p class="card-title">${escHtml(title)}</p>
        <div class="waveform" aria-hidden="true">
          ${Array.from({ length: 8 }).map(() => '<span></span>').join('')}
        </div>
        <div class="progress-wrap"><div class="progress-bar" id="prog-${id}"></div></div>
        <div class="card-actions">
          <button class="btn-play" id="play-${id}" data-id="${id}" aria-label="${escHtml(title)} を再生">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
            再生
          </button>
          <button class="btn-delete" data-id="${id}" aria-label="${escHtml(title)} を削除" title="削除">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      `;

      card.querySelector('.btn-play').addEventListener('click', () => togglePlay(id, url));
      card.querySelector('.btn-delete').addEventListener('click', () => deleteSound(id));
      card.querySelector('.btn-fav').addEventListener('click', () => toggleFavorite(id));

      return card;
    }

    function toggleFavorite(id) {
      const snd = sounds.find(s => s.id === id);
      if (snd) {
        snd.favorite = !snd.favorite;
        save();
        render();
      }
    }

    // ─── PLAY / PAUSE ─────────────────────────────────────────────────────────
    function togglePlay(id, url) {
      // Already playing this track → pause
      if (currentId === id && currentAudio && !currentAudio.paused) {
        currentAudio.pause();
        setCardPlaying(id, false);
        currentId = null;
        return;
      }

      // Stop whatever is playing
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        if (currentId) setCardPlaying(currentId, false);
      }

      // Play new
      currentAudio = new Audio(url);
      currentId = id;
      setCardPlaying(id, true);

      currentAudio.addEventListener('timeupdate', () => {
        if (!currentAudio.duration) return;
        const pct = (currentAudio.currentTime / currentAudio.duration) * 100;
        const bar = document.getElementById(`prog-${id}`);
        if (bar) bar.style.width = pct + '%';
      });

      currentAudio.addEventListener('ended', () => {
        setCardPlaying(id, false);
        const bar = document.getElementById(`prog-${id}`);
        if (bar) bar.style.width = '0';
        currentId = null;
      });

      currentAudio.addEventListener('error', () => {
        setCardPlaying(id, false);
        currentId = null;
        showToast('⚠️ 音声の読み込みに失敗しました。URLを確認してください。');
      });

      currentAudio.play().catch(() => {
        setCardPlaying(id, false);
        currentId = null;
        showToast('⚠️ 再生できませんでした。URLを確認してください。');
      });
    }

    function setCardPlaying(id, isPlaying) {
      const card = document.querySelector(`.sound-card[data-id="${id}"]`);
      const btn = document.getElementById(`play-${id}`);
      if (!card || !btn) return;
      card.classList.toggle('playing', isPlaying);
      btn.innerHTML = isPlaying
        ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> 停止`
        : `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg> 再生`;
    }

    // ─── ADD ──────────────────────────────────────────────────────────────────
    function addSound() {
      const titleEl = document.getElementById('input-title');
      const urlEl = document.getElementById('input-url');
      const title = titleEl.value.trim();
      const url = urlEl.value.trim();

      if (!title) { showToast('❗ 題名を入力してください'); titleEl.focus(); return; }
      if (!url) { showToast('❗ URLを入力してください'); urlEl.focus(); return; }
      if (!isValidUrl(url)) { showToast('❗ 有効なURLを入力してください'); urlEl.focus(); return; }

      sounds.push({ id: crypto.randomUUID(), title, url, favorite: false });
      save();
      render();

      titleEl.value = '';
      urlEl.value = '';
      titleEl.focus();
      showToast('✅ 追加しました！');
    }

    // ─── DELETE ───────────────────────────────────────────────────────────────
    function deleteSound(id) {
      if (currentId === id && currentAudio) {
        currentAudio.pause();
        currentId = null;
      }
      sounds = sounds.filter(s => s.id !== id);
      save();
      render();
      showToast('🗑️ 削除しました');
    }

    document.getElementById('btn-clear-all').addEventListener('click', () => {
      if (!confirm('すべての音声を削除しますか？')) return;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; currentId = null; }
      sounds = [];
      save();
      render();
    });

    // ─── HELPERS ─────────────────────────────────────────────────────────────
    function isValidUrl(str) {
      try { new URL(str); return true; } catch { return false; }
    }
    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ─── EVENTS ───────────────────────────────────────────────────────────────
    document.getElementById('btn-add').addEventListener('click', addSound);
    document.getElementById('input-url').addEventListener('keydown', e => { if (e.key === 'Enter') addSound(); });
    document.getElementById('input-title').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('input-url').focus(); });
    document.getElementById('input-search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // ─── START ────────────────────────────────────────────────────────────────
    load();
  </script>
</body>

</html>
